<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ape-dts UI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#fafafa; color:#09090b; font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .box { width:100%; max-width:22rem; padding:2.5rem; background:#ffffff; border:1px solid #e4e4e7;
         border-radius:0.625rem; box-shadow:0 1px 2px rgba(0,0,0,0.04); box-sizing:border-box; }
  h1 { font-size:1.1rem; margin:0 0 1.25rem; text-align:center; }
  label { display:block; font-size:0.82rem; color:#71717a; margin:0 0 0.3rem; }
  input { width:100%; box-sizing:border-box; padding:0.5rem 0.65rem; margin-bottom:1rem; font-size:0.9rem;
          border:1px solid #e4e4e7; border-radius:0.4rem; background:#fff; color:#09090b; }
  input:focus { outline:none; border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,0.15); }
  button { width:100%; padding:0.55rem; font-size:0.9rem; font-weight:600; color:#fafafa;
           background:#18181b; border:none; border-radius:0.4rem; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:default; }
  .error { color:#dc2626; font-size:0.82rem; margin:-0.5rem 0 1rem; min-height:1.1em; }
</style>
</head>
<body>
  <div class="box">
    <h1>ape-dts UI — Sign in</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="error"></p>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          errorEl.textContent = body.error || 'Sign in failed';
          return;
        }
        location.href = '/';
      } catch {
        errorEl.textContent = 'Could not reach the server';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
